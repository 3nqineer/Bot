name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create native Android platform
        run: flutter create --platforms=android --project-name odtu_reservation --org com.communitysport .
      - name: Optional Firebase configuration from repository secrets
        env:
          FIREBASE_OPTIONS_DART_B64: ${{ secrets.FIREBASE_OPTIONS_DART_B64 }}
          FIREBASE_GOOGLE_SERVICES_JSON_B64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [[ -n "$FIREBASE_OPTIONS_DART_B64" && -n "$FIREBASE_GOOGLE_SERVICES_JSON_B64" ]]; then
            printf '%s' "$FIREBASE_OPTIONS_DART_B64" | base64 --decode > lib/firebase_options.dart
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
            echo 'ENABLE_PUSH=true' >> "$GITHUB_ENV"
            python3 scripts/prepare_android.py --firebase
          else
            echo 'ENABLE_PUSH=false' >> "$GITHUB_ENV"
            python3 scripts/prepare_android.py
          fi
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Run Flutter smoke tests
        run: flutter test
      - name: Build APK
        run: flutter build apk --release --dart-define=ENABLE_PUSH=${{ env.ENABLE_PUSH }}
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ODTU-Spor-Takip-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
